<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扬帆手账 · 个人生活数据站</title>
  <!-- Bootstrap CSS（CDN，注明版本号） -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自定义海洋风样式（在Bootstrap之后引入，保证能覆盖） -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- 统一导航：首页、支出看板、明细查询、扬帆三维 四个入口 -->
  <nav class="navbar navbar-expand-md sticky-top shadow-sm nav-sea">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#home">扬帆手账</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#main-nav" aria-controls="main-nav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav ms-auto" id="nav-list">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#dashboard">支出看板</a></li>
          <li class="nav-item"><a class="nav-link" href="#records">明细查询</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">扬帆三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 错误提示区（断网、数据为空、格式错时显示） -->
  <div class="container mt-3">
    <div id="status" class="alert alert-warning" role="alert" style="display:none;"></div>
  </div>

  <!-- 首页：海洋风横幅 + 模块卡片 -->
  <header id="home" class="hero-sea text-white">
    <div class="container py-5">
      <h1 class="display-6 fw-bold">扬帆手账</h1>
      <p class="lead mb-0">记录每一笔支出，驶向自由的远方。—— 个人消费数据站（期末大作业原型）</p>
    </div>
  </header>

  <section class="container py-4">
    <div class="row g-3" id="home-cards">
      <div class="col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h6">支出看板</h2>
            <p class="card-text">各月各类消费汇总卡片，柱状图与趋势折线图一目了然。</p>
            <a href="#dashboard" class="btn btn-sea btn-sm">查看看板</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h6">明细查询</h2>
            <p class="card-text">按月份与类别筛选每一笔消费明细，实时显示合计。</p>
            <a href="#records" class="btn btn-sea btn-sm">查询明细</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h6">扬帆三维</h2>
            <p class="card-text">A-Frame 构建的"扬帆·自由之海"场景，记账之余出海放松。</p>
            <a href="three-d/scene.html" class="btn btn-sea btn-sm">进入三维</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 支出看板区块 -->
  <section id="dashboard" class="container py-4 border-top">
    <h2 class="h4 mb-2">支出看板</h2>
    <p class="text-muted small" id="sub-title">数据来源：自建教学数据（虚构）</p>
    <!-- 数据源切换：正常数据 / 空数据，用于演示"暂无数据"状态（复用课堂六 my-dashboard 模式） -->
    <div class="mb-3">
      <label for="data-source" class="form-label me-2 small text-muted">数据源：</label>
      <select id="data-source" class="form-select form-select-sm w-auto d-inline-block">
        <option value="data/expenses.json" selected>正常数据（expenses.json）</option>
        <option value="data/empty.json">空数据（empty.json）</option>
      </select>
    </div>
    <!-- 汇总卡片 -->
    <div class="row g-3 mb-4" id="cards"></div>
    <!-- 双图表 -->
    <div id="bar-chart" class="mb-4"></div>
    <div id="line-chart"></div>
  </section>

  <!-- 明细查询区块 -->
  <section id="records" class="container py-4 border-top">
    <h2 class="h4 mb-3">明细查询</h2>
    <!-- 筛选控件（app.js 渲染，事件委托） -->
    <div class="mb-3" id="record-filters"></div>
    <!-- 明细表 -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr><th>月份</th><th>类别</th><th>项目</th><th class="text-end">金额（元）</th></tr>
        </thead>
        <tbody id="record-body"></tbody>
        <tfoot id="record-foot"></tfoot>
      </table>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="container py-4 border-top text-center text-muted small">
    <p>扬帆手账 · 软件开发综合实践指南七 课后整合练习 · 数据为自建教学数据（虚构）</p>
  </footer>

  <!-- 库在前，自己的代码在后 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 断网兜底：CDN 库加载失败时给出明确提示（原生 JS，不依赖任何库） -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (typeof window.jQuery === 'undefined' || typeof window.echarts === 'undefined' || typeof window.Chart === 'undefined') {
        var el = document.getElementById('status');
        el.style.display = 'block';
        el.textContent = '网络连接失败：页面依赖的 Bootstrap / jQuery / ECharts / Chart.js（CDN）未能加载，请检查网络后刷新重试。';
      }
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
